<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#010e24">
  <title>Esqueci minha senha | QUIZ TECH</title>
  <meta name="description" content="Esqueceu a senha do QUIZ TECH? Informe seu e-mail e receba um link para criar uma nova senha com segurança.">
  <link rel="icon" type="image/svg+xml" href="assets/logo/marca.svg">
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
</head>
<body>
  <main id="app">
    <form class="card form auth-card" id="form" novalidate>
      <div class="auth-logo"><img src="assets/logo/logo-circular.png" alt="QUIZ TECH" width="144" height="144"></div>
      <h1>Esqueci minha senha</h1>
      <p class="muted">Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link para a escolha de uma nova senha.</p>
      <div id="msg"></div>
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div>
      <button class="btn block" type="submit" id="submit">Enviar link</button>
      <p class="muted" style="margin-top:16px"><a href="login.html">Voltar à página de entrada</a></p>
    </form>
  </main>
  <script type="module" src="js/esqueci-senha.js"></script>
</body>
</html>
