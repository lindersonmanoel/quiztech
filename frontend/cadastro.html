<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#010e24">
  <title>Cadastro | QUIZ TECH</title>
  <meta name="description" content="Crie sua conta gratuita no QUIZ TECH e realize quizzes de tecnologia com certificado de conclusão.">
  <link rel="icon" type="image/svg+xml" href="assets/logo/marca.svg">
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
</head>
<body>
  <main id="app">
    <form class="card form auth-card" id="form" novalidate>
      <div class="auth-logo"><img src="assets/logo/logo-circular.png" alt="QUIZ TECH" width="144" height="144"></div>
      <h1>Criar conta</h1>
      <div id="msg"></div>
      <div class="field"><label for="name">Nome completo</label><input id="name" type="text" autocomplete="name" minlength="2" maxlength="80" required>
        <small class="muted">Este nome aparecerá no seu certificado.</small></div>
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Senha (mínimo 8 caracteres)</label><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div>
      <div class="field check"><label><input id="terms" type="checkbox" required>
        <span>Li e concordo com a <a href="privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>.</span></label></div>
      <button class="btn block" type="submit" id="submit">Cadastrar</button>
      <p class="muted" style="margin-top:16px">O cadastro é gratuito. Após a criação da conta, um tutorial rápido apresenta o funcionamento do site.</p>
      <p class="muted">Já tem conta? <a href="login.html">Entrar</a></p>
    </form>
  </main>
  <script type="module" src="js/cadastro.js"></script>
</body>
</html>
