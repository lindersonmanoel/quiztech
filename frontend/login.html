<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152f">
  <title>Entrar — QUIZ TECH</title>
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <form class="card form" id="form" novalidate>
      <h1>Entrar</h1>
      <div id="msg"></div>
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="submit">Entrar</button>
      <p class="muted" style="margin-top:16px">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </form>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
