<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#010e24">
  <title>Sem conexão | QUIZ TECH</title>
  <meta name="description" content="Você está sem internet. O QUIZ TECH volta a abrir assim que a conexão for restabelecida.">
  <link rel="icon" type="image/svg+xml" href="assets/logo/marca.svg">
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <form class="card form auth-card" onsubmit="return false">
      <div class="auth-logo"><img src="assets/logo/logo.png" alt="QUIZ TECH" width="144" height="144"></div>
      <h1>Sem conexão</h1>
      <p class="muted">Você está sem conexão. Os quizzes exigem acesso à internet para a correção e para a emissão do certificado.</p>
      <p class="muted">Conecte-se à internet e tente novamente.</p>
      <button class="btn block" type="button" id="retry">Tentar novamente</button>
    </form>
  </main>
  <script src="js/offline.js"></script>
</body>
</html>
