<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#010e24">
  <!-- O link do e-mail traz o token: nada dele pode vazar para outros sites pelo Referer. -->
  <meta name="referrer" content="no-referrer">
  <title>Nova senha | QUIZ TECH</title>
  <meta name="description" content="Crie uma nova senha para a sua conta do QUIZ TECH usando o link enviado por e-mail.">
  <link rel="icon" type="image/svg+xml" href="assets/logo/marca.svg">
  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
</head>
<body>
  <main id="app">
    <form class="card form auth-card" id="form" novalidate>
      <div class="auth-logo"><img src="assets/logo/logo-circular.png" alt="QUIZ TECH" width="144" height="144"></div>
      <h1>Nova senha</h1>
      <div id="msg" aria-live="polite"></div>
      <div id="campos">
        <div class="field"><label for="password">Nova senha</label>
          <input id="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="dica">
          <small id="dica" class="muted">No mínimo 8 caracteres. Uma frase longa é mais segura do que uma senha curta.</small></div>
        <div class="field"><label for="confirm">Repita a nova senha</label>
          <input id="confirm" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn block" type="submit" id="submit">Salvar nova senha</button>
      </div>
      <p class="muted" style="margin-top:16px" id="rodape"><a href="login.html">Voltar à página de entrada</a></p>
    </form>
  </main>
  <script type="module" src="js/redefinir-senha.js"></script>
</body>
</html>
