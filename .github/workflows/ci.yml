name: Testes do backend

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quiztech
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: quiztech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiztech -d quiztech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-node
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://quiztech:teste@localhost:5432/quiztech_test
      JWT_SECRET: segredo-so-para-ci-com-mais-de-32-caracteres
      FRONTEND_URL: http://localhost:5500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - run: npm ci
      - name: Aplicar migracoes e carga inicial no banco de teste
        run: |
          npm run migrate
          npm run seed
      - name: Rodar testes
        run: npm test
